<header class="site-header">
  <div class="site-shell header-inner">
    <a class="wordmark" href="{{ "/" | relURL }}">Jamie Lakritz</a>
    <nav class="site-nav">
      <a href="{{ "/" | relURL }}#work" {{ if .IsHome }}class="is-active"{{ end }}>Works</a>
      <a href="{{ "/#about" | relURL }}">About</a>
      <a href="{{ "/#notebook" | relURL }}">Notebook</a>
      <a href="{{ "/#contact" | relURL }}">Contact</a>
    </nav>
    <button class="nav-toggle" aria-label="Menu" onclick="openMobileMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
</header>

<div class="mobile-menu" id="mobile-menu">
  <div class="mobile-menu__top">
    <span class="wordmark">Jamie Lakritz</span>
    <button class="mobile-menu__close" aria-label="Close" onclick="closeMobileMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="mobile-menu__links">
    <a href="{{ "/" | relURL }}#work" onclick="closeMobileMenu()">Works</a>
    <a href="{{ "/#about" | relURL }}" onclick="closeMobileMenu()">About</a>
    <a href="{{ "/#notebook" | relURL }}" onclick="closeMobileMenu()">Notebook</a>
    <a href="{{ "/#contact" | relURL }}" onclick="closeMobileMenu()">Contact</a>
  </div>
</div>
